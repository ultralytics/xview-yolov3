name: ❓ Question
description: Ask an xview-yolov3 question
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for asking an xview-yolov3 ❓ Question!

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please search the [README](https://github.com/ultralytics/xview-yolov3#readme), [issues](https://github.com/ultralytics/xview-yolov3/issues) and [discussions](https://github.com/orgs/ultralytics/discussions) to see if a similar question already exists.
      options:
        - label: >
            I have searched the xview-yolov3 [issues](https://github.com/ultralytics/xview-yolov3/issues) and [discussions](https://github.com/orgs/ultralytics/discussions) and found no similar questions.
          required: true

  - type: textarea
    attributes:
      label: Question
      description: What is your question? Please provide as much information as possible. Include the commands you ran, console output, and the context in which the issue occurs. Format your text and code using [Markdown](https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax) for clarity and readability.
      placeholder: |
        💡 ProTip! Include as much information as possible (logs, tracebacks, screenshots etc.) to receive the most helpful response.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional
      description: Anything else you would like to share?
